version: 2

sources:
  - name: tpch_sf1
    description: A copy of Snowflake's TPCH_SF1 schema
    database: analytics_project
    schema: TPCH_SF1
    tables:
      - name: customer
        description: Information about the customers
        columns:
        - name: c_custkey
          tests:
            - unique
            - not_null
        - name: c_nationkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'nation')
                field: n_nationkey
      - name: lineitem
        description: Information about the items ordered in an order
        columns:
        - name: l_orderkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'orders')
                field: o_orderkey
        - name: l_partkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'part')
                field: p_partkey
        - name: l_suppkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'supplier')
                field: s_suppkey
        - name: l_linenumber
          tests:
            - not_null
      - name: nation
        description: Information about nations
        columns:
        - name: n_nationkey
          tests:
            - unique
            - not_null
        - name: n_regionkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'region')
                field: r_regionkey
      - name: orders
        description: Information about the orders created
        columns:
        - name: o_orderkey
          tests:
            - unique
            - not_null
        - name: o_custkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'customer')
                field: c_custkey
      - name: part
        description: Information about parts
        columns:
        - name: p_partkey
          tests:
            - unique
            - not_null
      - name: partsupp
        description: Relation between a part and its supplier
        columns:
        - name: ps_partkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'part')
                field: p_partkey
        - name: ps_suppkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'supplier')
                field: s_suppkey
      - name: region
        description: Information about regions
        columns:
        - name: r_regionkey
          tests:
            - unique
            - not_null
      - name: supplier
        description: Information about suppliers
        columns:
        - name: s_suppkey
          tests:
            - unique
            - not_null
        - name: s_nationkey
          tests:
            - not_null
            - relationships:
                to: source('tpch_sf1', 'nation')
                field: n_nationkey